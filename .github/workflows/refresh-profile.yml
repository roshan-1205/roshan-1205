name: Refresh Akatsuki Commit Tracker

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours, UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akatsuki-commit-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update GitHub commit tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: roshan-1205
        run: python3 scripts/update_activity.py

      - name: Publish updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-tracker.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Akatsuki commit tracker"
            git push
          fi
